<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triage: study planner that tells the truth</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#6b6a63;--line:#e3e1d8;--red:#b3261e;--redbg:#fdecea;--amb:#8a5a00;--ambbg:#fff4de;--grn:#1b6b3a;--grnbg:#e5f4ea;--blue:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#21211e;--ink:#f1efe8;--mut:#a3a199;--line:#37362f;--red:#ff8a80;--redbg:#3a1f1c;--amb:#ffc872;--ambbg:#3a2d14;--grn:#7fd9a0;--grnbg:#16301f;--blue:#8fb0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0;font-size:28px;letter-spacing:-.5px}.sub{color:var(--mut);margin:2px 0 18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.status{border-radius:14px;padding:16px;border:1px solid}
.status.bad{background:var(--redbg);border-color:var(--red);color:var(--red)}
.status.warn{background:var(--ambbg);border-color:var(--amb);color:var(--amb)}
.status.ok{background:var(--grnbg);border-color:var(--grn);color:var(--grn)}
.big{font-size:30px;font-weight:700;line-height:1.1}.nums{display:flex;gap:18px;margin-top:8px;font-size:14px;color:var(--ink)}
.nums b{display:block;font-size:18px}
.grp{font-weight:700;font-size:14px;margin:12px 0 4px}.grp:first-child{margin-top:0}
.row{padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px}
.t-def{background:var(--redbg);color:var(--red)}.t-red{background:var(--ambbg);color:var(--amb)}.t-keep{background:var(--grnbg);color:var(--grn)}
details summary{cursor:pointer;color:var(--blue);font-size:13px;margin-top:2px}details p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.blk{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.blk:first-child{border-top:0}.blk time{font-variant-numeric:tabular-nums;color:var(--mut);min-width:108px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:800;letter-spacing:.04em;width:100%;padding:16px;font-size:17px}
@media(prefers-color-scheme:dark){button.primary{color:#1c0b09}}
input[type=number]{font:inherit;width:84px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.chg{border-left:4px solid var(--blue);padding-left:12px}.mut{color:var(--mut);font-size:13px}
input[type=text],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.frm{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr;gap:8px;margin-top:10px}.frm label,.av label{display:block;font-size:12px;color:var(--mut)}
@media(max-width:560px){.frm{grid-template-columns:1fr 1fr}.frm .wide{grid-column:1/-1}}
.err{color:var(--red);font-size:13px;margin-top:6px}.err:empty{display:none}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.trow:first-child{border-top:0}
.trow button{padding:4px 10px;font-size:13px}.av{margin:14px 0 12px;max-width:260px}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Triage</h1>
  <p class="sub">Study planner that tells the truth.</p>
  <div id="status"></div>
  <div id="empty" class="card mut" hidden>Add your tasks below, enter your study time, then press <b>PLAN MY TIME</b>.</div>
  <h2>Your tasks</h2>
  <div class="card" id="tasks">
    <div id="taskList"></div>
    <div id="demoNote" class="mut" style="margin-top:8px"></div>
    <button id="useOwn" style="margin-top:10px">Use my own tasks</button>
    <div id="form" hidden>
      <div class="frm">
        <div class="wide"><label for="tName">Task name</label><input id="tName" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Chemistry report"></div>
        <div><label for="tEst">Estimated minutes</label><input id="tEst" type="text" inputmode="numeric" autocomplete="off" placeholder="60"></div>
        <div><label for="tImp">Importance</label><select id="tImp"><option value="1">1 low</option><option value="2">2</option><option value="3" selected>3 normal</option><option value="4">4</option><option value="5">5 never cut</option></select></div>
        <div><label for="tDays">Due in (days)</label><input id="tDays" type="text" inputmode="numeric" autocomplete="off" placeholder="0 = today"></div>
        <div class="wide"><button id="addBtn">Add task</button></div>
      </div>
      <div class="err" id="formErr" role="alert"></div>
      <div class="av"><label for="tAvail">Available study time per day (minutes)</label><input id="tAvail" type="text" inputmode="numeric" autocomplete="off" value="120"></div>
      <div class="mut" style="margin:-8px 0 10px">Planning window: 15:00\u201322:00 each day (at most 7h/day count).</div>
      <div class="err" id="availErr" role="alert"></div>
      <button class="primary" id="planBtn">PLAN MY TIME</button>
    </div>
  </div>
  <div id="rest">
  <h2>Triage</h2><div class="card" id="triage"></div>
  <h2 id="planTitle">Plan</h2><div class="card" id="blocks"></div>
  <h2>Falling behind?</h2><div id="behind"></div>
  <div id="changes"></div>
  </div>
  <p class="mut" style="margin-top:28px"><button id="reset">Reset demo</button> &nbsp; All decisions come from a deterministic engine. No AI makes them.</p>
</main>

<script src="engine/triage-engine.js"></script>
<script src="engine/task-input.js"></script>
<script>
const run = TriageEngine.runTriageEngine;
const T = (id, name, seq, day, est, imp, o = {}) => ({ id, name, seq, deadlineDay: day, deadlineTime: o.time, estimate: est, completed: 0, importance: imp, allOrNothing: !!o.aon });
const demo = () => ({ now: 900, capacity: [120, 60, 60, 0, 60, 60, 60, 0, 60], tasks: [
  T('math', 'Math homework', 1, 1, 45, 3, { aon: 1, time: 480 }), T('phys', 'Physics worksheet', 2, 2, 60, 2),
  T('eng', 'English essay', 3, 3, 90, 3), T('quiz', 'Math quiz prep', 4, 4, 60, 4),
  T('bio', 'Biology exam', 5, 5, 150, 5), T('chem', 'Chemistry lab', 6, 6, 45, 3), T('hist', 'History project', 7, 8, 150, 4)] });

let S = demo(), R = run(S), prev = null, lastDone = {};
let mode = 'demo', draft = [], nextId = 1, planned = true;
const $ = (id) => document.getElementById(id);
const fmt = (m) => { const h = Math.floor(m / 60), x = m % 60; return h && x ? h + 'h ' + x + 'm' : h ? h + 'h' : x + 'm'; };
const hh = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const dayName = (d) => (d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : 'Day ' + d);
const nm = (id) => S.tasks.find((t) => t.id === id).name;
const dl = (s) => String(s).replace(/\bD(\d+)\b/g, (m, d) => (+d === 0 ? 'today' : +d === 1 ? 'tomorrow' : 'day ' + d));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderStatus() {
  const s = R.summary; let cls, head, sub;
  if (R.status === 'impossible') { cls = 'bad'; head = 'Still impossible'; sub = 'Even after cutting everything allowed, you are short by ' + fmt(R.stillImpossible.need) + '. Add time or ask for an extension.'; }
  else if (s.shortfall > 0) { cls = 'bad'; head = 'Short by ' + fmt(s.shortfall); sub = 'Your workload is not realistic. Triage below removes exactly that much.'; }
  else if (R.gapsFinal.some((g) => g.gap >= -14)) { cls = 'warn'; head = 'Realistic, but no slack'; sub = 'Any slip will break the plan.'; }
  else { cls = 'ok'; head = 'Realistic'; sub = 'Everything fits with room to spare.'; }
  if (R.status === 'atRisk') sub += ' Some time slots are too fragmented to use: see "At risk" below.';
  $('status').innerHTML = '<div class="status ' + cls + '"><div class="big">' + head + '</div><div>' + sub + '</div>' +
    '<div class="nums"><div><b>' + fmt(s.workload) + '</b>needed</div><div><b>' + fmt(s.capacity) + '</b>available</div><div><b>' + fmt(s.shortfall) + '</b>shortfall</div></div></div>';
}

function renderTriage() {
  const act = R.tasks.filter((t) => ['full', 'reduced', 'deferred'].includes(t.decision));
  const g = { full: [], reduced: [], deferred: [] }; act.forEach((t) => g[t.decision].push(t));
  const why = (t) => '<details><summary>Why?</summary><p>' + esc(dl(t.reason)) + '</p></details>';
  let h = '';
  if (g.full.length) h += '<div class="grp">Protect / keep</div>' + g.full.map((t) => '<div class="row">' + esc(t.name) + (t.protected ? '<span class="tag t-keep">PROTECTED</span>' : '<span class="tag t-keep">FULL</span>') + ' <span class="mut">' + fmt(t.allocated) + '</span>' + (t.atRisk ? '<span class="tag t-def">AT RISK: ' + fmt(t.unplaced) + ' unplaced</span>' : '') + why(t) + '</div>').join('');
  if (g.reduced.length) h += '<div class="grp">Reduce</div>' + g.reduced.map((t) => '<div class="row">' + esc(t.name) + '<span class="tag t-red">' + fmt(t.remaining) + ' \u2192 ' + fmt(t.allocated) + '</span>' + why(t) + '</div>').join('');
  if (g.deferred.length) h += '<div class="grp">Defer</div>' + g.deferred.map((t) => '<div class="row">' + esc(t.name) + '<span class="tag t-def">DEFERRED</span> <span class="mut">' + fmt(t.remaining) + ' not scheduled</span>' + why(t) + '</div>').join('');
  if (R.overdue.length) h += '<div class="grp">Overdue</div>' + R.overdue.map((id) => '<div class="row">' + esc(nm(id)) + ': set a new deadline or drop it.</div>').join('');
  $('triage').innerHTML = h || '<span class="mut">Nothing to schedule.</span>';
}

function planDay() { const d = R.blocks.length ? Math.min(...R.blocks.map((b) => b.day)) : null; return d; }
function renderBlocks() {
  const d = planDay();
  if (d === null) { $('planTitle').textContent = 'Plan'; $('blocks').innerHTML = '<span class="mut">No blocks to schedule.</span>'; return; }
  $('planTitle').textContent = dayName(d) + ': priority blocks';
  let t = d === 0 ? Math.max(S.now, 900) : 900;
  $('blocks').innerHTML = R.blocks.filter((b) => b.day === d).map((b) => {
    const s = t; t += b.minutes;
    return '<div class="blk"><time>' + hh(s) + ' \u2013 ' + hh(t) + '</time><span>' + esc(nm(b.taskId)) + ' <span class="mut">' + b.minutes + ' min</span></span></div>';
  }).join('') + '<div class="mut" style="margin-top:6px">Time is the constraint, not the number of tasks.</div>';
}

function renderBehind(open) {
  const d = planDay();
  if (d !== 0) { $('behind').innerHTML = '<div class="card mut">Nothing is planned for today. Come back when a session is due.</div>'; return; }
  if (!open) { $('behind').innerHTML = '<button class="primary" id="fb">I FELL BEHIND</button>'; $('fb').onclick = () => renderBehind(true); return; }
  const planned = {}; R.blocks.filter((b) => b.day === 0).forEach((b) => { planned[b.taskId] = (planned[b.taskId] || 0) + b.minutes; });
  $('behind').innerHTML = '<div class="card"><b>What actually happened today?</b>' + Object.keys(planned).map((id) =>
    '<div class="fr"><span>' + esc(nm(id)) + '<span class="mut"> planned ' + planned[id] + ' min</span></span><span><input type="number" min="0" max="999" value="' + planned[id] + '" data-id="' + esc(id) + '"> min</span></div>').join('') +
    '<div style="margin-top:10px"><button class="primary" id="rp">REPLAN</button></div></div>';
  $('rp').onclick = () => {
    const before = R;
    const done = {};
    document.querySelectorAll('#behind input').forEach((i) => { const t = S.tasks.find((x) => x.id === i.dataset.id); const add = Math.max(0, Math.round(+i.value || 0)); t.completed += add; done[i.dataset.id] = add; });
    S.now = 1320; prev = before; lastDone = done; R = run(S); render();
  };
}

const desc = (t) => t.decision === 'deferred' ? 'deferred' : t.decision === 'reduced' ? 'reduced to ' + fmt(t.allocated) : t.decision === 'done' ? 'done' : 'kept (' + fmt(t.allocated) + ')';
// What the old plan still expected for this task after subtracting the minutes the student actually did.
// A task only "changed" if the new allocation differs from that carried-forward expectation.
const carried = (p) => Math.max(0, p.allocated - (lastDone[p.id] || 0));
const was = (p) => carried(p) > 0 ? 'planned ' + fmt(carried(p)) : p.decision === 'deferred' ? 'deferred' : 'nothing more planned';
function renderChanges() {
  if (!prev) { $('changes').innerHTML = ''; return; }
  const ch = R.tasks.map((t) => [t, prev.tasks.find((p) => p.id === t.id)]).filter(([t, p]) => t.allocated !== carried(p));
  $('changes').innerHTML = '<h2>Your plan changed</h2><div class="card chg">' + (ch.length ? ch.map(([t, p]) => '<div class="row">' + esc(t.name) + ': <span class="mut">' + was(p) + '</span> \u2192 <b>' + desc(t) + '</b></div>').join('') : 'No change needed. You are on the plan.') +
    '<div class="mut" style="margin-top:6px">Protected tasks were not touched.</div></div>';
}

const dueLabel = (d, time) => dayName(d).toLowerCase() + (time !== undefined ? ' ' + hh(time) : '');
function renderTasks() {
  const demoMode = mode === 'demo';
  $('form').hidden = demoMode; $('useOwn').hidden = !demoMode;
  $('demoNote').textContent = demoMode ? 'Demo data. Press "Use my own tasks" to enter yours.' : '';
  const rows = demoMode ? S.tasks.map((t) => ({ id: t.id, name: t.name, estimate: t.estimate, importance: t.importance, days: t.deadlineDay, time: t.deadlineTime })) : draft;
  $('taskList').innerHTML = rows.length ? rows.map((r) => '<div class="trow"><span>' + esc(r.name) + ' <span class="mut">' + fmt(r.estimate) + ' \u00b7 importance ' + r.importance + ' \u00b7 due ' + dueLabel(r.days, r.time) + '</span></span>' +
    (demoMode ? '' : '<button data-rm="' + esc(r.id) + '" aria-label="Remove task">Remove</button>') + '</div>').join('') : '<span class="mut">No tasks yet. Add your first task below.</span>';
}
function render() {
  const show = mode === 'demo' || planned;
  $('empty').hidden = show; $('status').hidden = !show; $('rest').hidden = !show;
  renderTasks();
  if (show) { renderStatus(); renderTriage(); renderBlocks(); renderBehind(false); renderChanges(); }
}
const invalidate = () => { planned = false; prev = null; lastDone = {}; };   // editing tasks => plan is rebuilt from scratch (no leftover progress)
$('useOwn').onclick = () => { mode = 'user'; draft = []; nextId = 1; invalidate(); $('formErr').textContent = ''; $('availErr').textContent = ''; render(); };
$('taskList').onclick = (e) => {
  const id = e && e.target && e.target.dataset && e.target.dataset.rm;
  if (!id || mode !== 'user') return;
  draft = draft.filter((t) => t.id !== id); invalidate(); render();
};
$('addBtn').onclick = () => {
  if (mode !== 'user') return;
  if (draft.length >= TaskInput.LIMITS.MAX_TASKS) { $('formErr').textContent = 'You can plan at most ' + TaskInput.LIMITS.MAX_TASKS + ' tasks at a time.'; return; }
  const v = TaskInput.validateTask({ name: $('tName').value, estimate: $('tEst').value, importance: $('tImp').value, days: $('tDays').value });
  if (!v.ok) { $('formErr').textContent = Object.values(v.errors).join(' '); return; }
  draft.push(Object.assign({ id: 'u' + (nextId++) }, v.task));
  $('formErr').textContent = ''; $('tName').value = ''; $('tEst').value = ''; $('tDays').value = '';
  invalidate(); render();
};
$('planBtn').onclick = () => {
  if (mode !== 'user') return;
  const a = TaskInput.validateAvailable($('tAvail').value);
  $('availErr').textContent = a.ok ? '' : a.error;
  $('formErr').textContent = draft.length ? '' : 'Add at least one task first.';
  if (!a.ok || !draft.length) return;
  S = TaskInput.buildState(draft, a.value); R = run(S); prev = null; lastDone = {}; planned = true; render();
};
$('reset').onclick = () => { mode = 'demo'; draft = []; planned = true; S = demo(); R = run(S); prev = null; lastDone = {}; render(); };
render();
</script>
</body>
</html>
