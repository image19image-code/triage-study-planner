<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Triage — the study planner that tells the truth</title>
  <desc id="desc">10 hours needed, 8 hours available, short by 2 hours.</desc>
  <rect width="1200" height="630" fill="#f7f6f1"/>
  <rect x="58" y="58" width="1084" height="514" rx="24" fill="#fff" stroke="#e1ddd2" stroke-width="2"/>
  <rect x="58" y="58" width="12" height="514" rx="6" fill="#b42318"/>
  <text x="104" y="116" fill="#7c7f8a" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TRIAGE STUDY PLANNER</text>
  <text x="104" y="218" fill="#131418" font-family="Georgia, serif" font-size="96" font-weight="700">Triage</text>
  <text x="104" y="270" fill="#4f525b" font-family="Georgia, serif" font-size="34" font-style="italic">The study planner that tells the truth.</text>
  <line x1="104" y1="312" x2="1096" y2="312" stroke="#e1ddd2" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="104" y="376" fill="#131418" font-size="58" font-weight="700">10h</text>
    <text x="104" y="412" fill="#7c7f8a" font-size="18" font-weight="700" letter-spacing="2">NEEDED</text>
    <text x="436" y="376" fill="#131418" font-size="58" font-weight="700">8h</text>
    <text x="436" y="412" fill="#7c7f8a" font-size="18" font-weight="700" letter-spacing="2">AVAILABLE</text>
    <text x="768" y="376" fill="#b42318" font-size="58" font-weight="700">2h</text>
    <text x="768" y="412" fill="#b42318" font-size="18" font-weight="700" letter-spacing="2">SHORT BY</text>
    <text x="104" y="506" fill="#0f6233" font-size="25" font-weight="700">PROTECT</text>
    <text x="332" y="506" fill="#131418" font-size="25">→</text>
    <text x="376" y="506" fill="#8a5300" font-size="25" font-weight="700">REDUCE</text>
    <text x="604" y="506" fill="#131418" font-size="25">→</text>
    <text x="648" y="506" fill="#4f525b" font-size="25" font-weight="700">DEFER</text>
    <text x="104" y="544" fill="#7c7f8a" font-size="17">Workload against available time, then a plan you can keep.</text>
  </g>
</svg>
